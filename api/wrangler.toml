name = "trektrivia-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# the vault lives here; create with `wrangler kv namespace create VAULT` and paste the id
[[kv_namespaces]]
binding = "VAULT"
id = "REPLACE_ME"

# five submissions a minute per IP, so bots can't burn API credit
[[ratelimits]]
name = "SUBMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# secrets, set with `wrangler secret put <NAME>`:
#   ANTHROPIC_API_KEY   for vetting
#   ADMIN_KEY           for /pending and /approve
