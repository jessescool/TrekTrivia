name = "trektrivia-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "trektrivia.com", custom_domain = true },
  { pattern = "www.trektrivia.com", custom_domain = true },
]

# the vault lives here; create with `wrangler kv namespace create VAULT` and paste the id
[[kv_namespaces]]
binding = "VAULT"
id = "fb3cec519f8d41d5838cc8363e08e6f0"

# five submissions a minute per IP, so bots can't burn API credit
[[ratelimits]]
name = "SUBMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# secrets, set with `wrangler secret put <NAME>`:
#   ANTHROPIC_API_KEY   for vetting
#   ADMIN_KEY           for /pending and /approve

# the static site is served from the repo root; the api paths go to the Worker first
[assets]
directory = "../"
binding = "ASSETS"
run_worker_first = true
